<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tempest AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #090b10;
      --surface:   #0f1219;
      --border:    #1c2130;
      --accent:    #4f8ef7;
      --accent2:   #8b5cf6;
      --pulse:     #22d3ee;
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --danger:    #f43f5e;
      --success:   #10b981;
      --glow:      rgba(79,142,247,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── background grid ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79,142,247,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,142,247,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── top nav ── */
    nav {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      background: rgba(9,11,16,0.8);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface);
      transition: all 0.3s;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }

    .status-pill.connected { color: var(--success); border-color: rgba(16,185,129,0.3); }
    .status-pill.connected .status-dot { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse-dot 2s infinite; }
    .status-pill.listening { color: var(--pulse); border-color: rgba(34,211,238,0.3); }
    .status-pill.listening .status-dot { background: var(--pulse); box-shadow: 0 0 8px var(--pulse); animation: pulse-dot 1s infinite; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── main layout ── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 0;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── hero / orb column ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding-right: 40px;
    }

    .orb-wrap {
      position: relative;
      width: 220px;
      height: 220px;
    }

    .orb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #6ea8ff, #4f8ef7 40%, #8b5cf6 75%, #1e0a3c);
      box-shadow:
        0 0 60px rgba(79,142,247,0.25),
        0 0 120px rgba(139,92,246,0.15),
        inset 0 0 40px rgba(255,255,255,0.05);
      transition: box-shadow 0.4s, transform 0.4s;
    }

    .orb.speaking {
      animation: orb-speak 1.2s ease-in-out infinite alternate;
      box-shadow:
        0 0 80px rgba(79,142,247,0.5),
        0 0 160px rgba(139,92,246,0.3),
        inset 0 0 60px rgba(255,255,255,0.08);
    }

    @keyframes orb-speak {
      from { transform: scale(1);    box-shadow: 0 0 80px rgba(79,142,247,0.5),  0 0 160px rgba(139,92,246,0.3); }
      to   { transform: scale(1.07); box-shadow: 0 0 120px rgba(79,142,247,0.7), 0 0 200px rgba(139,92,246,0.45); }
    }

    /* ripple rings */
    .ring {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 1px solid rgba(79,142,247,0.2);
      opacity: 0;
    }
    .ring:nth-child(1) { inset: -20px; }
    .ring:nth-child(2) { inset: -42px; }
    .ring:nth-child(3) { inset: -68px; }

    .orb-wrap.active .ring {
      animation: ripple 2.4s ease-out infinite;
    }
    .orb-wrap.active .ring:nth-child(2) { animation-delay: 0.8s; }
    .orb-wrap.active .ring:nth-child(3) { animation-delay: 1.6s; }

    @keyframes ripple {
      0%   { opacity: 0.6; transform: scale(1); }
      100% { opacity: 0;   transform: scale(1.18); }
    }

    /* ── waveform ── */
    .waveform {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 48px;
    }

    .bar {
      width: 3px;
      border-radius: 2px;
      background: linear-gradient(to top, var(--accent), var(--accent2));
      height: 6px;
      transition: height 0.1s;
    }

    .waveform.active .bar {
      animation: wave 1s ease-in-out infinite alternate;
    }

    .bar:nth-child(1)  { animation-delay: 0.0s; }
    .bar:nth-child(2)  { animation-delay: 0.1s; }
    .bar:nth-child(3)  { animation-delay: 0.2s; }
    .bar:nth-child(4)  { animation-delay: 0.3s; }
    .bar:nth-child(5)  { animation-delay: 0.2s; }
    .bar:nth-child(6)  { animation-delay: 0.15s; }
    .bar:nth-child(7)  { animation-delay: 0.05s; }
    .bar:nth-child(8)  { animation-delay: 0.25s; }
    .bar:nth-child(9)  { animation-delay: 0.35s; }
    .bar:nth-child(10) { animation-delay: 0.1s; }
    .bar:nth-child(11) { animation-delay: 0.2s; }
    .bar:nth-child(12) { animation-delay: 0.0s; }

    @keyframes wave {
      from { height: 4px; }
      to   { height: 38px; }
    }

    /* ── agent label ── */
    .agent-label {
      text-align: center;
    }

    .agent-label h1 {
      font-family: 'Space Mono', monospace;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .agent-label p {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 400;
    }

    /* ── controls ── */
    .controls {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 20px rgba(79,142,247,0.3);
    }

    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(79,142,247,0.45); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .btn-danger {
      background: rgba(244,63,94,0.12);
      color: var(--danger);
      border: 1px solid rgba(244,63,94,0.3);
    }

    .btn-danger:hover { background: rgba(244,63,94,0.2); }

    .mic-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .mic-btn.muted {
      background: rgba(244,63,94,0.12);
      border: 1px solid rgba(244,63,94,0.3);
      color: var(--danger);
    }

    /* ── sidebar: conversation ── */
    .sidebar {
      border-left: 1px solid var(--border);
      padding-left: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: calc(100vh - 120px);
      position: sticky;
      top: 32px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .clear-btn {
      font-size: 0.72rem;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      transition: color 0.2s;
    }
    .clear-btn:hover { color: var(--danger); }

    /* ── transcript ── */
    .transcript {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: msg-in 0.25s ease;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-who {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .msg.agent .msg-who { color: var(--accent); }
    .msg.user  .msg-who { color: var(--accent2); }

    .msg-text {
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .msg.agent .msg-text { border-left: 2px solid var(--accent); }
    .msg.user  .msg-text { border-left: 2px solid var(--accent2); }

    /* empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    .empty-icon { font-size: 32px; opacity: 0.4; }

    /* ── connect panel ── */
    #connect-panel {
      position: fixed;
      inset: 0;
      background: rgba(9,11,16,0.9);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .connect-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .connect-card h2 {
      font-family: 'Space Mono', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .connect-card p {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--muted); }

    .error-msg {
      font-size: 0.8rem;
      color: var(--danger);
      min-height: 18px;
    }

    /* ── toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 0.82rem;
      color: var(--text);
      opacity: 0;
      transition: all 0.3s;
      z-index: 200;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── responsive ── */
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; padding: 20px 16px; }
      .sidebar { border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 24px; height: 320px; position: static; }
      .hero { padding-right: 0; }
      nav { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<!-- connect panel -->
<div id="connect-panel">
  <div class="connect-card">
    <div>
      <div class="logo" style="margin-bottom:16px;">
        <div class="logo-icon">⚡</div>
        Tempest AI
      </div>
      <h2>Start a session</h2>
      <p style="margin-top:8px;">Enter your name to connect with Tempest AI — your intelligent voice partner.</p>
    </div>
    <div class="field">
      <label>Your Name</label>
      <input id="name-input" type="text" placeholder="e.g. Boss" />
    </div>
    <div class="field">
      <label>Room (optional)</label>
      <input id="room-input" type="text" placeholder="tempest-room" />
    </div>
    <div class="error-msg" id="connect-error"></div>
    <button class="btn btn-primary" id="connect-btn" style="width:100%;justify-content:center;padding:14px;">
      ⚡ Connect to Tempest AI
    </button>
  </div>
</div>

<!-- nav -->
<nav>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    Tempest AI
  </div>
  <div class="status-pill" id="status-pill">
    <div class="status-dot"></div>
    <span id="status-text">Disconnected</span>
  </div>
</nav>

<!-- main -->
<main>
  <!-- hero -->
  <div class="hero">
    <div class="orb-wrap" id="orb-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="orb" id="orb"></div>
    </div>

    <div class="waveform" id="waveform">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div class="agent-label">
      <h1>Tempest AI</h1>
      <p id="agent-state">Waiting to connect…</p>
    </div>

    <div class="controls">
      <button class="btn btn-ghost mic-btn" id="mic-btn" title="Toggle mic" disabled>🎙️</button>
      <button class="btn btn-danger" id="disconnect-btn" disabled>Disconnect</button>
    </div>
  </div>

  <!-- sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Conversation</span>
      <button class="clear-btn" id="clear-btn">Clear</button>
    </div>
    <div class="transcript" id="transcript">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">💬</div>
        <div>Connect to start talking with Tempest AI</div>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<!-- LiveKit JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script>
  const { Room, RoomEvent, Track, TrackEvent, createLocalTracks } = LivekitClient;

  let room = null;
  let micEnabled = true;
  let localMicTrack = null;

  /* ── DOM refs ── */
  const orbEl        = document.getElementById('orb');
  const orbWrap      = document.getElementById('orb-wrap');
  const waveform     = document.getElementById('waveform');
  const statusPill   = document.getElementById('status-pill');
  const statusText   = document.getElementById('status-text');
  const agentState   = document.getElementById('agent-state');
  const transcript   = document.getElementById('transcript');
  const emptyState   = document.getElementById('empty-state');
  const micBtn       = document.getElementById('mic-btn');
  const disconnectBtn = document.getElementById('disconnect-btn');
  const connectPanel = document.getElementById('connect-panel');
  const connectBtn   = document.getElementById('connect-btn');
  const nameInput    = document.getElementById('name-input');
  const roomInput    = document.getElementById('room-input');
  const connectError = document.getElementById('connect-error');
  const clearBtn     = document.getElementById('clear-btn');
  const toastEl      = document.getElementById('toast');

  /* ── toast ── */
  function toast(msg, duration = 3000) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  /* ── status ── */
  function setStatus(label, state) {
    statusText.textContent = label;
    statusPill.className = 'status-pill ' + (state || '');
  }

  function setAgentState(text, speaking = false) {
    agentState.textContent = text;
    if (speaking) {
      orbEl.classList.add('speaking');
      orbWrap.classList.add('active');
      waveform.classList.add('active');
    } else {
      orbEl.classList.remove('speaking');
      orbWrap.classList.remove('active');
      waveform.classList.remove('active');
    }
  }

  /* ── transcript ── */
  function addMessage(who, text) {
    emptyState && emptyState.remove();
    const msg = document.createElement('div');
    msg.className = `msg ${who}`;
    msg.innerHTML = `
      <div class="msg-who">${who === 'agent' ? '⚡ Tempest AI' : '🧑 You'}</div>
      <div class="msg-text">${text}</div>
    `;
    transcript.appendChild(msg);
    transcript.scrollTop = transcript.scrollHeight;
  }

  clearBtn.addEventListener('click', () => {
    transcript.innerHTML = `
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">💬</div>
        <div>Conversation cleared</div>
      </div>`;
  });

  /* ── connect ── */
  connectBtn.addEventListener('click', connect);
  nameInput.addEventListener('keydown', e => e.key === 'Enter' && connect());

  async function connect() {
    const name = nameInput.value.trim() || 'Boss';
    const roomName = roomInput.value.trim() || 'tempest-room';
    connectError.textContent = '';
    connectBtn.disabled = true;
    connectBtn.textContent = 'Connecting…';

    try {
      const res = await fetch(`/api/token?name=${encodeURIComponent(name)}&room=${encodeURIComponent(roomName)}`);
      if (!res.ok) throw new Error('Token server error — is server.py running?');
      const { token, url } = await res.json();

      room = new Room({ adaptiveStream: true, dynacast: true });
      bindRoomEvents();

      await room.connect(url, token);
      await room.localParticipant.setMicrophoneEnabled(true);

      connectPanel.style.display = 'none';
      micBtn.disabled = false;
      disconnectBtn.disabled = false;
      setStatus('Connected', 'connected');
      setAgentState('Tempest AI is listening…');
      toast('Connected! Say hi to Tempest AI 👋');

    } catch (err) {
      connectError.textContent = err.message;
      connectBtn.disabled = false;
      connectBtn.textContent = '⚡ Connect to Tempest AI';
    }
  }

  /* ── room events ── */
  function bindRoomEvents() {
    room.on(RoomEvent.Disconnected, () => {
      setStatus('Disconnected', '');
      setAgentState('Disconnected');
      micBtn.disabled = true;
      disconnectBtn.disabled = true;
      toast('Session ended.');
    });

    room.on(RoomEvent.ParticipantConnected, participant => {
      if (participant.identity.startsWith('agent')) {
        setStatus('Agent joined', 'connected');
        setAgentState('Tempest AI is ready!');
      }
    });

    room.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
      if (track.kind === Track.Kind.Audio) {
        const el = track.attach();
        el.style.display = 'none';
        document.body.appendChild(el);

        // detect agent speaking via volume
        const ctx = new AudioContext();
        const src  = ctx.createMediaStreamSource(el.srcObject);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);

        let speaking = false;
        function tick() {
          analyser.getByteFrequencyData(data);
          const avg = data.reduce((a,b) => a+b,0) / data.length;
          const nowSpeaking = avg > 10;
          if (nowSpeaking !== speaking) {
            speaking = nowSpeaking;
            setAgentState(speaking ? 'Tempest AI is speaking…' : 'Tempest AI is listening…', speaking);
            setStatus(speaking ? 'Speaking' : 'Listening', speaking ? 'listening' : 'connected');
          }
          requestAnimationFrame(tick);
        }
        tick();
      }
    });

    // data channel messages (transcript from agent)
    room.on(RoomEvent.DataReceived, (payload, participant) => {
      try {
        const decoded = new TextDecoder().decode(payload);
        const data = JSON.parse(decoded);
        if (data.type === 'transcript') {
          addMessage(data.role === 'user' ? 'user' : 'agent', data.text);
        }
      } catch {}
    });
  }

  /* ── mic toggle ── */
  micBtn.addEventListener('click', async () => {
    if (!room) return;
    micEnabled = !micEnabled;
    await room.localParticipant.setMicrophoneEnabled(micEnabled);
    micBtn.textContent = micEnabled ? '🎙️' : '🔇';
    micBtn.className = `btn mic-btn${micEnabled ? '' : ' muted'}`;
    toast(micEnabled ? 'Mic on' : 'Mic muted');
  });

  /* ── disconnect ── */
  disconnectBtn.addEventListener('click', async () => {
    if (room) await room.disconnect();
    connectPanel.style.display = 'flex';
    connectBtn.disabled = false;
    connectBtn.textContent = '⚡ Connect to Tempest AI';
    orbEl.classList.remove('speaking');
    orbWrap.classList.remove('active');
    waveform.classList.remove('active');
  });
</script>
</body>
</html>
